# Local stack. Usage:
#   cp .env.example .env
#   docker compose up --wait     # detached; returns once every service is healthy
#
# Host ports bind to 127.0.0.1 only. Memory limits roughly mirror the share each
# workload gets on the t4g.large (8 GiB) in production.

name: bankjob

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 20

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankjob}
      POSTGRES_USER: ${POSTGRES_USER:-bankjob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (cp .env.example .env)}
    volumes:
      # Postgres 18+ images keep PGDATA under a versioned subdirectory of this path.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    mem_limit: 512m

  kafka:
    image: apache/kafka:4.4.0
    environment:
      # Single combined broker + controller in KRaft mode (no ZooKeeper).
      CLUSTER_ID: zfjlZ9g5SaGPvdv06ONEWg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Never auto-create: game-api's outbox relay creates the topics and their DLQs.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      <<: *healthcheck-defaults
      interval: 10s
      timeout: 10s
      start_period: 20s
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
    mem_limit: 1g

  jaeger:
    # Jaeger v2 is an OpenTelemetry Collector distribution: it receives OTLP and stores
    # traces in memory (ADR-0007).
    image: jaegertracing/jaeger:2.22.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./infra/compose/jaeger.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC, for services run outside compose
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
    mem_limit: 256m

  game-api:
    build:
      context: . # repo root: the image bundles content/ (tiles, levels)
      dockerfile: services/game-api/Dockerfile
      target: ${GAME_API_TARGET:-jvm} # set GAME_API_TARGET=native to run the native image
    image: bankjob/game-api:local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-bankjob}
      POSTGRES_USER: ${POSTGRES_USER:-bankjob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (cp .env.example .env)}
      # Local only: with no key/salt configured, game-api generates throwaway ones at startup
      # (tokens stop working after a restart). Production refuses to start without them.
      BANKJOB_ALLOW_EPHEMERAL_SECRETS: "true"
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # game-api and the agent share LLM_MODE and the model id; stub never calls the model.
      LLM_MODE: ${LLM_MODE:-stub}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      LLM_MONTHLY_BUDGET_CENTS: ${LLM_MONTHLY_BUDGET_CENTS:-1200}
      AGENT_URL: http://agent:8000
      DAILY_SEED_OVERRIDE: ${DAILY_SEED_OVERRIDE:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      # OTLP over HTTP (both services); /v1/traces is appended by each SDK.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # GET /v1/traces/{id} reads traces back from Jaeger's query API.
      JAEGER_QUERY_URL: http://jaeger:16686
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 30s
      # Runtime images have bash but no curl/wget; /dev/tcp keeps them minimal.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
    mem_limit: 512m

  agent:
    build: ./services/agent
    image: bankjob/agent:local
    environment:
      LLM_MODE: ${LLM_MODE:-stub}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      # Read only when LLM_MODE=live; leave it empty in .env for stub mode.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Penny's tools and briefs come from game-api's MCP server (internal network only).
      GAME_API_MCP_URL: http://game-api:8080/mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
    mem_limit: 256m

  web:
    build: ./web
    image: bankjob/web:local
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    mem_limit: 64m

volumes:
  pgdata:
  kafkadata:
