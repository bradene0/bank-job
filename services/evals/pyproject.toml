[project]
name = "bankjob-evals"
version = "0.1.0"
description = "Attack-matrix harness and replay-file generator for Bank Job."
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=2.2.0",
    "httpx2>=2.16.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0",
]

[project.scripts]
bankjob-evals = "bankjob_evals.cli:main"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0",
    "mypy>=2.0",
    "pytest>=9.0",
    "ruff>=0.17",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain cooldown: never resolve a release younger than 7 days.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
