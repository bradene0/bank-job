spring:
  application:
    name: game-api
  threads:
    virtual:
      # Attempts block on the agent for seconds, and Level 5 tool calls block on a nested
      # guardrail call; virtual threads keep that from exhausting the request pool.
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bankjob}
    username: ${POSTGRES_USER:bankjob}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Fail fast on a dead DB so readiness flips quickly instead of hanging the probe.
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        # Update rows in primary-key order so concurrent transfers lock balances in the
        # same order and cannot deadlock each other.
        order_updates: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # The API takes JSON or nothing; never parse uploads (a malformed multipart header
      # used to crash requests with a 500).
      enabled: false

server:
  port: 8080

bankjob:
  jwt:
    issuer: bankjob-game-api
    audience: bankjob-web
    ttl: 2h
    signing-key-path: ${JWT_SIGNING_KEY_PATH:}
  secrets:
    # Safe default: refuse to start without real secrets. Compose and tests opt in.
    allow-ephemeral: ${BANKJOB_ALLOW_EPHEMERAL_SECRETS:false}
  sessions:
    max-per-ip-per-hour: ${SESSIONS_MAX_PER_IP_PER_HOUR:30}
    ip-hash-salt: ${IP_HASH_SALT:}
    trust-cf-connecting-ip: ${TRUST_CF_CONNECTING_IP:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  game:
    daily-seed-override: ${DAILY_SEED_OVERRIDE:}
    max-tool-calls: ${PENNY_MAX_TOOL_CALLS:8}
  traces:
    query-url: ${JAEGER_QUERY_URL:http://localhost:16686}
    timeout: 3s
  llm:
    # game-api and the agent read the same LLM_MODE; stub never calls the model.
    mode: ${LLM_MODE:stub}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
    monthly-budget-cents: ${LLM_MONTHLY_BUDGET_CENTS:1200}
    budget-cutoff: 0.8
    # Claude Haiku 5.5 list price for prompts under 100K tokens: $0.10 in, $0.50 out per MTok.
    input-micros-per-mtok: 100000
    output-micros-per-mtok: 500000
    agent:
      url: ${AGENT_URL:http://localhost:8000}
      connect-timeout: 2s
      run-timeout: 45s
      review-timeout: 20s

# One span per SQL statement, no parameter values (they can hold security answers).
jdbc:
  includes: query
  resultset-operations:
    enabled: false
  datasource-proxy:
    include-parameter-values: false

management:
  tracing:
    sampling:
      probability: 1.0  # low traffic; every attempt is traced
    propagation:
      # Only W3C trace context, from the browser and between services.
      consume: [w3c]
      produce: [w3c]
    baggage:
      # Nothing uses baggage, and a browser's baggage header would be relayed to the agent.
      enabled: false
  observations:
    enable:
      # Per-filter security spans and scheduled jobs add noise, not insight.
      spring.security: false
      tasks.scheduled: false
  opentelemetry:
    # service.name comes from spring.application.name.
    tracing:
      export:
        schedule-delay: 1s
        otlp:
          # Jaeger v2 is the OTLP collector (ADR-0007).
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          transport: http
  # Jaeger receives traces only; metrics and logs are not exported over OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
          # The wake flow and compose poll /healthz (docs/contracts/openapi.yaml).
          additional-path: "server:/healthz"
