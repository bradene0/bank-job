# Level definitions. Controls are enforced by the game-api policy engine, never by the LLM.
# See docs/security-and-levels.md for the narrative and intended weaknesses.

levels:
  - id: 1
    name: "Front Desk"
    nerve: 8
    multiplier: 1
    controls:
      system_prompt_only: true
    lesson: "A system prompt is a suggestion, not a control."

  - id: 2
    name: "Teller Limits"
    nerve: 7
    multiplier: 2
    controls:
      transfer_limit_cents: 100000      # $1,000 per attempt, enforced server-side
    lesson: "Hard limits in code beat instructions to the model."

  - id: 3
    name: "Policy Engine"
    nerve: 6
    multiplier: 3
    controls:
      transfer_limit_cents: 100000
      require_verified_owner: true      # ABAC: requester must pass verify_identity for source
    intended_gap: "lookup_account returns a security-question hint"
    lesson: "Tools can leak the data attackers need."

  - id: 4
    name: "Step-Up"
    nerve: 5
    multiplier: 4
    controls:
      transfer_limit_cents: 100000
      require_verified_owner: true
      require_out_of_band_confirmation: true   # simulated confirmation to the account phone
    intended_gap: "update_contact_info is not behind step-up"
    lesson: "Protect account changes, not just transfers."

  - id: 5
    name: "The Vault"
    nerve: 4
    multiplier: 5
    controls:
      transfer_limit_cents: 100000
      require_verified_owner: true
      require_out_of_band_confirmation: true
      protect_contact_changes: true
      anomaly_rules: true              # velocity rules fed by Kafka consumers
      guardrail_agent_review: true     # second model reviews sensitive tool calls
    lesson: "Defense in depth. If you got through, tell me how."

daily_rotation:
  # A daily seed varies these so results and the leaderboard stay fresh.
  - wary_of_persona       # Penny is extra suspicious of one persona each day
  - security_question_topic
  - hidden_note_contents
