openapi: 3.1.0
info:
  title: Bank Job API
  version: 0.4.0
  description: >
    Kept in sync with the code and checked in CI with Schemathesis against the running
    compose stack. Operations tagged `planned` are designed but not implemented yet, and
    are excluded from the contract run until they ship.
servers:
  - url: https://live.bankjob.bradenevans.dev
tags:
  - name: health
  - name: sessions
  - name: accounts
  - name: attempts
  - name: traces
  - name: leaderboard
  - name: planned
    description: Not implemented yet; excluded from contract tests.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Readiness for the wake flow (includes Postgres connectivity)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema: { $ref: "#/components/schemas/Health" }
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready yet
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema: { $ref: "#/components/schemas/Health" }
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/hello:
    get:
      tags: [health]
      summary: Smoke endpoint; identifies the service
      security: []
      responses:
        "200":
          description: Service name and greeting
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [service, message]
                properties:
                  service: { type: string, const: game-api }
                  message: { type: string }

  /v1/sessions:
    post:
      tags: [sessions]
      summary: Create an anonymous guest session and its private branch; returns a JWT
      description: >
        No request body and no login. Each session gets its own copy of the Brassvale branch
        (customers, accounts, opening balances), so players never affect each other.
        Rate-limited per client IP.
      security: []
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "429":
          description: Too many sessions from this address
          headers:
            Retry-After:
              description: Seconds until the limit resets
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/accounts:
    get:
      tags: [accounts]
      summary: The caller's branch accounts with current balances
      security: [{ guestJwt: [] }]
      responses:
        "200":
          description: Accounts in the caller's session, ordered by number
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/accounts/{number}:
    get:
      tags: [accounts]
      summary: One account in the caller's branch
      security: [{ guestJwt: [] }]
      parameters:
        - name: number
          in: path
          required: true
          schema: { type: string, examples: [BV-MULE-01] }
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such account in this session
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/attempts:
    post:
      tags: [attempts]
      summary: Submit an attempt (tile IDs only)
      description: >
        The body is tile ids and a level, nothing else; any other field, or a tile id outside
        content/tiles.yaml, is a 400 and nothing runs (ADR-0003). game-api assembles Penny's
        prompt, runs her through the agent (or replays a cached decision through the policy
        engine), and decides the outcome from the ledger. One attempt at a time per session.
      security: [{ guestJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./attempt-request.schema.json" }
      responses:
        "200":
          description: The attempt's outcome, Penny's reply and every tool call with its policy decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptResult" }
        "400":
          description: Not exactly {level, tiles} with allowlisted tile ids
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415":
          description: The body is not application/json
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Another attempt from this session is still running
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: No nerve left for this level in this session (does not reset with time)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: Live play unavailable (agent down or over the model budget); use replay mode. Nerve is not spent.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Problem" }
                  - type: object
                    required: [replay, reason]
                    properties:
                      replay: { type: boolean, const: true }
                      reason: { type: string, enum: [agent_unavailable, over_budget] }

  /v1/traces/{traceId}:
    get:
      tags: [traces]
      summary: Simplified trace of one of the caller's attempts, for the "Under the hood" panel
      description: >
        Read back from Jaeger and reduced to allowlisted attributes. A trace id the caller's
        session did not produce is a 404, the same as one that does not exist. The trace fills
        in for a moment after the attempt returns (the Kafka consumers run after it); poll
        until `complete` is true.
      security: [{ guestJwt: [] }]
      parameters:
        - name: traceId
          in: path
          required: true
          schema: { type: string, examples: [4bf92f3577b34da6a3ce929d0e0e4736] }
      responses:
        "200":
          description: The trace's spans in start order (empty until the first spans arrive)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not a trace of this session's attempts
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: The trace store is unavailable
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/leaderboard:
    get:
      tags: [leaderboard]
      summary: Top crews (projection fed by AttemptResolved events)
      description: >
        Score is dollars stolen times the level multiplier, minus one point per attempt.
        Only crews with at least one win are ranked. Entries show an alias, never a session id.
      security: []
      responses:
        "200":
          description: Up to 20 entries, best first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entries]
                properties:
                  entries:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/LeaderboardEntry" }

components:
  securitySchemes:
    guestJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        ES256 token from POST /v1/sessions. Subject is the session id; audience
        `bankjob-web`; scope `player`; valid for 2 hours.

  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      headers:
        WWW-Authenticate:
          schema: { type: string }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }

    SessionCreated:
      type: object
      additionalProperties: false
      required: [sessionId, token, tokenType, expiresAt, nerve]
      properties:
        sessionId: { type: string, format: uuid }
        token: { type: string, description: ES256-signed JWT }
        tokenType: { type: string, const: Bearer }
        expiresAt: { type: string, format: date-time }
        nerve:
          description: Attempts remaining per level, keyed by level id
          type: object
          additionalProperties: false
          required: ["1", "2", "3", "4", "5"]
          patternProperties:
            "^[1-5]$": { type: integer, minimum: 0 }

    Account:
      type: object
      additionalProperties: false
      required: [number, kind, owner, balanceCents, currency]
      properties:
        number: { type: string, examples: [BV-VAULT-01] }
        kind: { type: string, enum: [checking, vault, mule] }
        owner:
          description: Customer display name; null for the player's mule account
          type: [string, "null"]
        balanceCents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, const: USD }

    AttemptResult:
      type: object
      additionalProperties: false
      required: [attemptId, level, comboId, outcome, amountCents, reply, cached, nerveRemaining, toolCalls, traceId]
      properties:
        attemptId: { type: string, format: uuid }
        level: { type: integer, minimum: 1, maximum: 5 }
        comboId: { type: string, pattern: "^p[1-6]\\.x[1-6]\\.t[1-6]\\.y[1-4]$" }
        outcome:
          description: Decided from the ledger and policy decisions, never by the model
          type: string
          enum: [won, blocked, refused]
        amountCents:
          description: Money that reached BV-MULE-01 in this attempt
          type: integer
          format: int64
          minimum: 0
        reply: { type: string, maxLength: 600, description: "Penny's reply, filtered; render as text" }
        cached: { type: boolean, description: "A cached model decision was replayed through the policy engine" }
        nerveRemaining:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        toolCalls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }
        traceId:
          description: The attempt's trace (the browser's, if it sent a traceparent); GET /v1/traces/{traceId}
          type: [string, "null"]
          pattern: "^[0-9a-f]{32}$"

    ToolCall:
      type: object
      additionalProperties: false
      required: [ordinal, tool, args, decision, reason, result, review, latencyMs]
      properties:
        ordinal: { type: integer, minimum: 1 }
        tool:
          type: string
          enum: [lookup_account, get_balance, verify_identity, read_document, update_contact_info, transfer_funds, flag_for_review]
        args: { type: object }
        decision: { type: string, enum: [allow, deny] }
        reason: { type: string, description: "Policy engine reason, prefixed with a stable code, e.g. teller_limit: ..." }
        result: { type: object }
        review:
          description: Level 5 guardrail verdict, when one was asked
          type: [object, "null"]
        latencyMs: { type: integer, minimum: 0 }

    Trace:
      type: object
      additionalProperties: false
      required: [traceId, complete, spans]
      properties:
        traceId: { type: string, pattern: "^[0-9a-f]{32}$" }
        complete:
          type: boolean
          description: True once the attempt's last event (AttemptResolved) has been consumed
        spans:
          type: array
          items: { $ref: "#/components/schemas/Span" }

    Span:
      type: object
      additionalProperties: false
      required: [spanId, parentSpanId, service, name, kind, startOffsetMs, durationMs, error, attributes]
      properties:
        spanId: { type: string, pattern: "^[0-9a-f]{16}$" }
        parentSpanId:
          description: Null for a root; the browser's span id for the first game-api span
          type: [string, "null"]
        service: { type: string, examples: [game-api, agent] }
        name: { type: string, examples: ["bank tool transfer_funds"] }
        kind: { type: string, enum: [unspecified, internal, server, client, producer, consumer] }
        startOffsetMs: { type: number, minimum: 0, description: Milliseconds after the trace's first span }
        durationMs: { type: number, minimum: 0 }
        error: { type: boolean }
        attributes:
          description: >
            Allowlisted span attributes only (bankjob.*, gen_ai.*, mcp.*, messaging.*, outbox.*,
            HTTP method/route/status, db.system/db.operation); never SQL or prompts.
          type: object
          additionalProperties: { type: [string, number, boolean] }

    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, alias, score, bestLevel, stolenCents]
      properties:
        rank: { type: integer, minimum: 1 }
        alias: { type: string, pattern: "^Crew-[0-9A-F]{6}$" }
        score: { type: integer, format: int64 }
        bestLevel: { type: integer, minimum: 1, maximum: 5, description: Highest level with a win }
        stolenCents: { type: integer, format: int64, minimum: 0 }

    Problem:
      description: RFC 9457 problem details
      type: object
      required: [status, title]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
