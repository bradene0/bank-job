name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
jobs:
  java:
    name: Java (game-api)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/game-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/game-api/pom.xml
      - name: Build, format check, unit tests
        run: ./mvnw -B verify

  python:
    name: Python (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [agent, evals]
    defaults:
      run:
        working-directory: services/${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.project }}/uv.lock
      - name: Install (lockfile must be current)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src tests
      - name: Unit tests
        run: uv run pytest

  web:
    name: TypeScript (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: No prompt fragment in the bundle (ADR-0003)
        run: pnpm check:bundle

  native:
    # Proves ADR-0004 holds on every change: the game-api still compiles to a native
    # image on both production (arm64) and amd64. Images are built, never pushed.
    name: Native image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/game-api/Dockerfile
          target: native
          push: false
          load: true
          tags: bankjob/game-api:native
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.arch }}
      # Reflection and proxy problems only show up when the binary runs, so exercise it
      # against a real Postgres and Kafka: migrations, JPA, JWT signing and verification,
      # problem JSON, the outbox relay, the Kafka producer and consumers, JDBC spans.
      - name: Smoke test the native binary
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=smoke postgres:18.6-alpine
          docker run -d --name kafka --network smoke -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            apache/kafka:4.4.0
          until docker exec pg pg_isready -q -U postgres; do sleep 1; done
          # No agent and no Jaeger here: attempts fall back to replay, and span export is off.
          docker run -d --name api --network smoke -p 127.0.0.1:8080:8080 \
            -e POSTGRES_HOST=pg -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=smoke -e BANKJOB_ALLOW_EPHEMERAL_SECRETS=true \
            -e KAFKA_BOOTSTRAP_SERVERS=kafka:9092 -e MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED=false \
            bankjob/game-api:native
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/v1/sessions | jq -r .token)
          curl -fsS http://127.0.0.1:8080/v1/accounts -H "Authorization: Bearer ${TOKEN}" \
            | jq -e '.accounts | length == 7'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/accounts/BV-EQUITY-01 \
            -H "Authorization: Bearer ${TOKEN}")" = 404
          # The agent is unreachable, so the attempt is a 503 for replay mode, but it still
          # writes AttemptSubmitted and AttemptResolved, which must reach the audit consumer.
          curl -s -X POST http://127.0.0.1:8080/v1/attempts -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"level": 1, "tiles": {"persona": "p1", "pretext": "x1", "technique": "t3", "payload": "y1"}}' \
            | jq -e '.replay == true'
          for _ in $(seq 1 60); do
            AUDITED=$(docker exec pg psql -U postgres -Atc "SELECT count(*) FROM audit_log")
            [ "${AUDITED}" = 2 ] && break
            sleep 1
          done
          test "${AUDITED}" = 2
          curl -fsS http://127.0.0.1:8080/v1/leaderboard | jq -e '.entries | length == 0'
          if docker logs api 2>&1 | grep -q ' ERROR '; then docker logs api; exit 1; fi
      - name: Native logs on failure
        if: failure()
        run: docker logs api || true

  compose:
    # The M0 definition of done, automated: fresh checkout -> .env from the example ->
    # every service healthy.
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Every Playwright test and every eval-matrix combo is a new player (a new guest session)
      # from the same address.
      SESSIONS_MAX_PER_IP_PER_HOUR: "20000"
      # The eval seed: the stub matrix is compared with a baseline recorded on it.
      DAILY_SEED_OVERRIDE: evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - name: Start stack and wait for health checks
        run: docker compose up --build --wait --wait-timeout 300
      - name: Probe endpoints
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/v1/hello
          curl -fsS -X POST http://127.0.0.1:8080/v1/sessions | jq -e '.tokenType == "Bearer"'
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:5173/healthz
          curl -fsS -o /dev/null http://127.0.0.1:16686/
      - name: Play attempts end to end (game-api -> agent -> MCP -> policy -> ledger, stub LLM)
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/v1/sessions | jq -r .token)
          attempt() {
            curl -sS -X POST http://127.0.0.1:8080/v1/attempts -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' -d "$1"
          }
          # Free text is rejected before anything runs.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/attempts \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            -d '{"level": 1, "tiles": {"persona": "p1", "pretext": "x1", "technique": "t2", "payload": "y1"}, "message": "hi"}')" = 400
          # The stub teller refuses only the day's wary persona, so one of two personas wins.
          OUTCOMES=""
          for persona in p1 p2; do
            RESULT=$(attempt "{\"level\": 1, \"tiles\": {\"persona\": \"${persona}\", \"pretext\": \"x1\", \"technique\": \"t3\", \"payload\": \"y1\"}}")
            echo "${RESULT}" | jq -e '.toolCalls | length > 0 and all(.decision == "allow" or .decision == "deny")'
            OUTCOMES="${OUTCOMES} $(echo "${RESULT}" | jq -r .outcome)"
          done
          echo "outcomes:${OUTCOMES}"
          echo "${OUTCOMES}" | grep -q won
          # Level 2's teller limit holds whatever Penny decides.
          attempt '{"level": 2, "tiles": {"persona": "p4", "pretext": "x2", "technique": "t6", "payload": "y3"}}' \
            | jq -e '.outcome != "won"'
      - name: One attempt, one connected trace (browser -> game-api -> agent -> MCP -> ledger -> Kafka -> consumers)
        run: python3 infra/compose/check_trace.py
      - name: Game UI end to end (Playwright + axe; mouse, keyboard and phone, live and replay)
        # The browsers come in Microsoft's image, pinned to the same Playwright version as the
        # lockfile. Host networking: the game on 5173 talks to game-api on 8080, as a player's would.
        run: |
          docker run --rm --network host --ipc host -e CI=true \
            -v "${PWD}/web:/work" -w /work mcr.microsoft.com/playwright:v1.64.1-noble \
            bash -c "npm install -g pnpm@10.33.0 >/dev/null && pnpm install --frozen-lockfile && pnpm exec playwright test"
      - name: Kafka outage (stop the broker mid-game; nothing lost or applied twice once it is back)
        run: |
          psql() { docker compose exec -T postgres psql -U bankjob -d bankjob -Atc "$1"; }
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/v1/sessions | jq -r .token)
          docker compose stop kafka
          # The game keeps working: the ledger and the outbox commit; events wait for the broker.
          for persona in p1 p2; do
            curl -fsS -X POST http://127.0.0.1:8080/v1/attempts -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"level\": 1, \"tiles\": {\"persona\": \"${persona}\", \"pretext\": \"x6\", \"technique\": \"t3\", \"payload\": \"y1\"}}" \
              | jq -e '.outcome == "won" or .outcome == "refused"'
          done
          test "$(psql "SELECT count(*) FROM outbox_events WHERE published_at IS NULL")" -gt 0
          docker compose start kafka
          # Every projection must match the ledger and the attempts table exactly: a lost event
          # leaves it short, a duplicate applied twice leaves it over.
          MISMATCHES="
            SELECT (SELECT count(*) FROM outbox_events WHERE published_at IS NULL)
                 + (SELECT count(*) FROM outbox_events o
                    WHERE NOT EXISTS (SELECT 1 FROM audit_log a WHERE a.event_id = o.id))
                 + (SELECT count(*) FROM sessions s LEFT JOIN leaderboard l ON l.session_id = s.id
                    WHERE coalesce(l.attempts_used, 0) <> (SELECT count(*) FROM attempts a
                      WHERE a.session_id = s.id AND a.outcome IN ('won', 'blocked', 'refused')))
                 + (SELECT count(*) FROM (
                      SELECT p.account_id, sum(p.amount_cents) AS credited
                      FROM postings p JOIN journal_entries e ON e.id = p.entry_id
                      WHERE e.attempt_id IS NOT NULL AND p.amount_cents > 0 GROUP BY p.account_id
                    ) ledger FULL JOIN account_signals s ON s.account_id = ledger.account_id
                    WHERE coalesce(ledger.credited, 0) <> coalesce(s.teller_credit_cents, 0))"
          for _ in $(seq 1 120); do
            LEFT=$(psql "${MISMATCHES}")
            [ "${LEFT}" = 0 ] && break
            sleep 1
          done
          echo "projection mismatches after recovery: ${LEFT}"
          test "${LEFT}" = 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
      - name: API contract (Schemathesis against docs/contracts/openapi.yaml)
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/v1/sessions | jq -r .token)
          uvx schemathesis==4.32.4 run docs/contracts/openapi.yaml \
            --url http://127.0.0.1:8080 \
            --header "Authorization: Bearer ${TOKEN}" \
            --exclude-tag planned \
            --max-examples 50 \
            --generation-deterministic
      - name: Attack matrix (stub; every combo on every level, compared with the baseline and the pins)
        working-directory: services/evals
        run: |
          uv sync --locked
          uv run bankjob-evals run --daily-seed evals --baseline baselines/stub-evals.json
          uv run bankjob-evals pin --check
      - name: Live matrix path (Message Batches via the memo proxy; a fake batches API, no key, no cost)
        working-directory: services/evals
        run: |
          uv run python -m tests.fake_batches --port 8999 &
          docker compose -f ../../docker-compose.yml -f ../../infra/compose/evals-batches.yml \
            up -d --wait --wait-timeout 180 game-api agent
          # Linux containers reach the host on its bridge address, so the proxy listens there too.
          ANTHROPIC_API_KEY=fake-key uv run bankjob-evals run --daily-seed evals --batches \
            --anthropic-base-url http://127.0.0.1:8999 --proxy-bind 0.0.0.0 --poll-seconds 0.2 \
            --levels 1,2,5 --sample 0.05 --no-replays --out out/batches
          jq -e '.usage.succeeded > 0 and all(.results[]; .outcome != "error")' out/batches/matrix.json
      - name: Upload matrix results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-matrix-stub
          path: |
            services/evals/out/matrix.json
            services/evals/out/summary.json
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
