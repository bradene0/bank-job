name: Release

# Every green CI run on main publishes multi-arch images to GHCR, tagged sha-<commit> and main.
# CI never reaches the cluster (ADR-0017): the owner deploys a commit from the admin machine
# with infra/k8s/deploy.sh, which pins these images by digest.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/bradene0/bank-job
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Each architecture builds on its own runner: GraalVM under emulation is far too slow.
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [game-api, agent]
        arch: [amd64, arm64]
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
          - {image: game-api, context: ., file: services/game-api/Dockerfile, target: native}
          - {image: agent, context: services/agent, file: services/agent/Dockerfile, target: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          # Pushed by digest only; the merge job tags the multi-arch index.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          # CI's native job builds the same commit into this cache, so the native compile is
          # usually a cache hit.
          cache-from: type=gha,scope=${{ matrix.image == 'game-api' && 'native' || 'agent' }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image == 'game-api' && 'native' || 'agent' }}-${{ matrix.arch }}
      - name: Record the digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [game-api, agent]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          refs=()
          for f in digests/*; do refs+=("${IMAGE}@$(cat "$f")"); done
          docker buildx imagetools create -t "${IMAGE}:sha-${SHA}" -t "${IMAGE}:main" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${SHA}" --format '{{.Manifest.Digest}}')"
          echo "${{ matrix.image }}: \`${IMAGE}@${digest}\` (sha-${SHA})" >> "${GITHUB_STEP_SUMMARY}"
