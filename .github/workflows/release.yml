name: Release

# Every green CI run on main publishes multi-arch images to GHCR, tagged sha-<commit> and main,
# and, once the owner approves the production environment, deploys the game and that run's
# replay files to the Worker. CI never reaches the cluster (ADR-0017): the owner deploys a
# commit's images from the admin machine with infra/k8s/deploy.sh, pinned by digest.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/bradene0/bank-job
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Each architecture builds on its own runner: GraalVM under emulation is far too slow.
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [game-api, agent]
        arch: [amd64, arm64]
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
          - {image: game-api, context: ., file: services/game-api/Dockerfile, target: native}
          - {image: agent, context: services/agent, file: services/agent/Dockerfile, target: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          # Pushed by digest only; the merge job tags the multi-arch index.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          # CI's native job builds the same commit into this cache, so the native compile is
          # usually a cache hit.
          cache-from: type=gha,scope=${{ matrix.image == 'game-api' && 'native' || 'agent' }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image == 'game-api' && 'native' || 'agent' }}-${{ matrix.arch }}
      - name: Record the digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [game-api, agent]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          refs=()
          for f in digests/*; do refs+=("${IMAGE}@$(cat "$f")"); done
          docker buildx imagetools create -t "${IMAGE}:sha-${SHA}" -t "${IMAGE}:main" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${SHA}" --format '{{.Manifest.Digest}}')"
          echo "${{ matrix.image }}: \`${IMAGE}@${digest}\` (sha-${SHA})" >> "${GITHUB_STEP_SUMMARY}"

  web:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    name: Deploy the game and replay files (Worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://bankjob.bradenevans.dev
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - name: Download the replay files from the commit's CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "${RUN_ID}" ]; then
            RUN_ID="$(gh run list -R "${GITHUB_REPOSITORY}" -w CI -c "${SHA}" -s success -L 1 \
              --json databaseId -q '.[0].databaseId')"
          fi
          gh run download "${RUN_ID}" -R "${GITHUB_REPOSITORY}" -n eval-matrix-stub -D eval
      - name: Overlay the latest full live-model run, if it played this content
        # A real model's recordings beat the scripted teller's. Use the newest successful live
        # run only when it played the whole matrix (no sample) on the same content as this
        # commit; its files replace the stub ones combo by combo, so a combo the live run could
        # not finish keeps its stub recording.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIVE_RUN="$(gh run list -R "${GITHUB_REPOSITORY}" -w "Evals (live)" -b main -s success \
            -L 20 --json databaseId -q '.[].databaseId' | head -n 20)"
          for id in ${LIVE_RUN}; do
            rm -rf live
            gh run download "${id}" -R "${GITHUB_REPOSITORY}" -n eval-matrix-live -D live 2>/dev/null || continue
            summary=live/out/summary.json
            [ -f "${summary}" ] || continue
            if jq -e --arg hash "$(jq -r .contentHash eval/summary.json)" \
                '.mode == "live" and .sample == null and .contentHash == $hash' "${summary}" >/dev/null; then
              count="$(find live/out/replay -name '*.json' | wc -l | tr -d ' ')"
              cp -R live/out/replay/. eval/replay/
              cp "${summary}" eval/summary.json
              echo "Replays: live-model run ${id} (${count} files) over the stub recordings" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          done
          echo "Replays: stub recordings (no full live run for this content)" >> "${GITHUB_STEP_SUMMARY}"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build and deploy
        working-directory: web
        env:
          # A token with Editor on this one Worker: versions only, the domain is never touched.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          RELEASE_TAG: sha-${{ env.SHA }}
          WRANGLER_SEND_METRICS: "false"
        run: scripts/deploy-worker.sh ../eval/replay ../eval/summary.json
