# Connects outbound to Cloudflare and forwards live.bankjob to Traefik (ADR-0017). The routes
# are managed remotely by Terraform; this only needs the tunnel token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: bankjob
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudflared}
  template:
    metadata:
      labels: {app: cloudflared}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.2
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: cloudflared, key: token}
          readinessProbe:
            httpGet: {path: /ready, port: 2000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 128Mi}
