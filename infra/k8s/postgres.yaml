apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bankjob
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bankjob
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          env:
            - {name: POSTGRES_DB, value: bankjob}
            - {name: POSTGRES_USER, value: bankjob}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, pg_isready -U bankjob -d bankjob]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            # Postgres 18+ images keep PGDATA under a versioned subdirectory of this path.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 10Gi}
