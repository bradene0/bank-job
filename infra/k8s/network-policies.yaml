# Nothing in the namespace accepts traffic unless a rule below allows it. Egress stays open:
# the agent calls Anthropic, cloudflared dials Cloudflare, and the VM firewall already blocks
# every private range outside the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: bankjob
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Public API from Traefik; MCP from the agent. Traefik and the tunnel only route /v1/* and
# /healthz, so /mcp is reachable from inside the namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: game-api
  namespace: bankjob
spec:
  podSelector:
    matchLabels: {app: game-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - podSelector:
            matchLabels: {app: agent}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent
  namespace: bankjob
spec:
  podSelector:
    matchLabels: {app: agent}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: game-api}
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: bankjob
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: game-api}
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
  namespace: bankjob
spec:
  podSelector:
    matchLabels: {app: kafka}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: game-api}
      ports:
        - port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger
  namespace: bankjob
spec:
  podSelector:
    matchLabels: {app: jaeger}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: game-api}
        - podSelector:
            matchLabels: {app: agent}
      ports:
        - port: 4318
    - from:
        - podSelector:
            matchLabels: {app: game-api}
      ports:
        - port: 16686
