# Production workloads on the homelab k3s node (ADR-0017). deploy.sh renders this with the
# image digests of a release; the jaeger config is shared with compose, hence:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone infra/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - traefik-config.yaml
  - network-policies.yaml
  - postgres.yaml
  - kafka.yaml
  - jaeger.yaml
  - agent.yaml
  - game-api.yaml
  - ingress.yaml
  - cloudflared.yaml

configMapGenerator:
  - name: jaeger-config
    namespace: bankjob
    files:
      - config.yaml=../compose/jaeger.yaml

images:
  - name: game-api
    newName: ghcr.io/bradene0/bank-job/game-api
    newTag: main
  - name: agent
    newName: ghcr.io/bradene0/bank-job/agent
    newTag: main
